[project]
name = "cam-control"
version = "2.2.1"
description = "pyLabLib cam-control (MicroSpin fork): camera control GUI whose TCP server SpinApp records images through"
readme = "README.rst"
license = { file = "LICENSE" }
# PySide2 5.15.2 and the pinned numpy/scipy/numba stack have no wheels past Python 3.9.
requires-python = "==3.9.*"
dependencies = [
    "imageio==2.9.0",
    "llvmlite==0.36.0",
    "numba==0.53.1",
    "numpy==1.21.1",
    "pandas==1.3.1",
    "Pillow==8.3.2",
    "plumbum==1.7.0",
    "pylablib==1.4.4",
    "pypiwin32==223",
    "pyqtgraph==0.12.2",
    "PySide2==5.15.2",
    "python-dateutil==2.8.2",
    "pytz==2021.1",
    "pywin32==301",
    "qdarkstyle==3.0.2",
    "rpyc==5.0.1",
    "scipy==1.7.0",
    # numba 0.53 imports pkg_resources; pip-made venvs shipped setuptools, uv-made ones do not.
    "setuptools==58.1.0",
    "shiboken2==5.15.2",
    "six==1.16.0",
    "tifffile==2022.8.12",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# pylablib declares PyQt5, and with both bindings installed it imports PyQt5 before PySide2.
# cam-control is built and released on PySide2, so PyQt5 is kept out.
override-dependencies = ["pyqt5; sys_platform == 'never'"]
