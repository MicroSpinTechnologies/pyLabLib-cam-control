# Rehearsal setup without a camera: a simulated camera with a software trigger, and the control server.
# Start with:  run-cam-control.bat --config-file simulated-camera.cfg
cameras/sim_trigger/kind	simulated_software_trigger
cameras/sim_trigger/display_name	Simulated camera (software trigger)
cameras/sim_trigger/params/size	(640, 480)
plugins/serv/class	server
plugins/serv/parameters/ip	127.0.0.1
